<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="教学工作台">
<meta name="theme-color" content="#e26d97">
<meta name="description" content="班级 / 学生 / 作业打卡 / 积分 / 课时 / AI 文案 一体化教师工作台">
<link rel="manifest" id="pwaManifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>教师教学工作台</title>
<style>
:root{
  --bg:#fdf7fa; --surface:#ffffff; --surface-2:#fdf2f7; --surface-3:#f8e9f1;
  --text:#3a2e35; --text-2:#7a6b74; --muted:#a896a1; --line:#f3e2ec;
  --brand:#e26d97; --brand-2:#f0a6c0; --brand-soft:#fdeef4;
  --ok:#2f9e57; --warn:#e09b2d; --danger:#d23a3a; --gold:#d4a373;
  --shadow:0 6px 24px rgba(180,120,150,.10); --radius:18px;
}
[data-theme="dark"]{
  --bg:#1a141a; --surface:#241c24; --surface-2:#2c222c; --surface-3:#352836;
  --text:#f6edf2; --text-2:#cabdc6; --muted:#94868f; --line:#3a2e3a;
  --brand:#f08aae; --brand-2:#f5b3cb; --brand-soft:#3a2330;
  --ok:#46b06a; --warn:#e8b04a; --danger:#e86a6a; --gold:#d9b083;
  --shadow:0 6px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:8px;opacity:.4}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
/* top bar */
.topbar{
  display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0;z-index:30;
}
.topbar .menu-btn{font-size:22px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.topbar .menu-btn:active{background:var(--surface-3)}
.back-btn{font-size:14px;font-weight:700;height:38px;min-width:44px;padding:0 12px;border-radius:12px;display:none;place-items:center;color:var(--text-2);background:var(--surface-2);border:1px solid var(--line);flex-shrink:0;transition:transform .12s ease,background .2s ease}
.back-btn.show{display:grid}
.back-btn.home{color:#fff;background:var(--brand);border-color:var(--brand)}
.back-btn:active{transform:scale(.95)}
.back-btn:disabled{opacity:.28;cursor:not-allowed}
.topbar h1{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.pill.off .dot{background:var(--muted)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px}
.icon-btn:active{background:var(--surface-3)}
/* body layout */
.body{flex:1;display:flex;min-height:0;position:relative}
.sidebar{
  position:absolute;left:0;top:0;bottom:0;width:240px;background:var(--surface);
  border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  z-index:40;display:flex;flex-direction:column;padding:12px;gap:4px;overflow-y:auto;
}
.sidebar.open{transform:translateX(0)}
.sidebar .nav-title{font-size:12px;color:var(--muted);font-weight:700;padding:14px 14px 6px;letter-spacing:.1em}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:14px;font-weight:600;color:var(--text-2);text-align:left;width:100%;border:1px solid transparent;transition:background .18s,color .18s,border-color .18s}
.nav-item .nav-no{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:20px;text-align:center;letter-spacing:.03em}
.nav-item .nav-label{flex:1}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item:active{background:var(--surface-3)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);border-color:color-mix(in srgb,var(--brand) 24%,transparent)}
.nav-item.active .nav-no{color:var(--brand)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:35;opacity:0;pointer-events:none;transition:.28s}
.scrim.show{opacity:1;pointer-events:auto}
.main{flex:1;min-width:0;overflow-y:auto;padding:14px 14px 116px;scroll-behavior:smooth;position:relative}
/* dual pane（学生管理双栏：整体钉在底部导航栏上方，两栏各自内部滚动，避免名单被导航栏遮住拖不到底） */
.dual{position:absolute;top:14px;left:14px;right:14px;bottom:116px;display:flex;gap:14px}
.dual-left{width:300px;flex-shrink:0;overflow-y:auto;padding-right:4px;min-height:0}
.dual-right{flex:1;min-width:0;overflow-y:auto;min-height:0}
.dual .back{display:none}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
.section-head h2{font-size:18px;font-weight:800}
.section-head p{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.grid{display:grid;gap:12px}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c4{grid-template-columns:repeat(4,1fr)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.tag.gray{background:var(--surface-3);color:var(--text-2)}
.tag.warn{background:#fff4e0;color:#b9750a}
.tag.danger{background:#ffe9e9;color:#c0392b}
.tag.ok{background:#e6f7ec;color:#0f7a3d}
/* 筛选/分类标签：未选=白底灰边（明确“未选中”），选中=粉色填充（明确“已选中”），避免整排都泛粉看不出状态 */
.cat-tab{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;background:var(--surface);color:var(--text-2);border:1px solid var(--line);cursor:pointer;transition:background .15s,color .15s,border-color .15s,transform .1s}
.cat-tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.cat-tab:active{transform:scale(.96)}
/* ===== 考勤课时统计：当日 / 当月 双组并列 ===== */
.kq-two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.hw-rate-two{align-items:start}
@media(max-width:640px){.hw-rate-two{grid-template-columns:1fr}}
.kq-grp{padding:12px}
.kq-grp-hd{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:10px}
.kq-grp-hd b{color:var(--text);font-variant-numeric:tabular-nums}
.kq-grp-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.kq-grp-dot.day{background:#3b82f6}
.kq-grp-dot.mon{background:#8b5cf6}
.kq-kpi{gap:8px}
.kq-kpi .kpi{min-height:80px}
@media(max-width:400px){.kq-grp-hd{font-size:12px}}
/* ===== 待办事项 ===== */
.todo-list{margin-top:6px}
.todo-item{display:flex;align-items:flex-start;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
.todo-item:last-child{border-bottom:none}
.todo-check{flex:0 0 auto;width:23px;height:23px;margin-top:1px;border-radius:8px;border:2px solid var(--line);background:transparent;color:#fff;font-size:13px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .16s cubic-bezier(.16,1,.3,1)}
.todo-check:active{transform:scale(.88)}
.todo-item.done .todo-check{background:var(--brand);border-color:var(--brand)}
.todo-text{flex:1;min-width:0;font-size:14.5px;line-height:1.5;word-break:break-word;cursor:pointer;transition:color .16s}
.todo-time{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:400}
.todo-item.done .todo-text{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.todo-del{flex:0 0 auto;width:26px;height:26px;color:var(--muted);font-size:19px;line-height:1;border-radius:8px;opacity:.5}
.todo-del:active{opacity:1;background:var(--surface-2)}
.todo-sep{font-size:11px;color:var(--muted);padding:12px 2px 2px;margin-top:6px;border-top:1px dashed var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;padding:10px 16px;border-radius:12px;background:var(--brand);color:#fff;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.96);filter:brightness(.95)}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.btn-danger{background:var(--danger);color:#fff;border:1px solid var(--danger)}
.btn-danger:hover{filter:brightness(.94)}
.is-disabled{opacity:.4;cursor:not-allowed}
.leave-confirm{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.leave-confirm .lc-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.gold{background:var(--gold);color:#3a2c00}
.btn.outline-gold{background:var(--surface);color:var(--gold);border:1px solid var(--gold)}
.btn.outline-gold:hover{background:color-mix(in srgb,var(--gold) 10%,var(--surface))}
.input,select.input,textarea.input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
textarea.input{min-height:120px;resize:vertical}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.tabbar{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:14px;margin-bottom:14px;flex-wrap:wrap}
.tabbar button{flex:1;min-width:74px;padding:9px;border-radius:10px;font-size:13px;font-weight:700;color:var(--text-2);white-space:nowrap}
.tabbar button.active{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.avatar{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:17px;flex-shrink:0}
.av1{background:linear-gradient(135deg,#e26d97,#f0a6c0)} .av2{background:linear-gradient(135deg,#f08aae,#e26d97)}
.av3{background:linear-gradient(135deg,#f0a6c0,#d98ab0)} .av4{background:linear-gradient(135deg,#e89bbd,#e26d97)}
.av5{background:linear-gradient(135deg,#c96b95,#f0a6c0)} .av6{background:linear-gradient(135deg,#f5b3cb,#e89bbd)}
.bar{height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.star{cursor:pointer;font-size:18px;color:var(--gold);user-select:none}
.stu-card{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);align-items:center;cursor:pointer;transition:border-color .15s,transform .1s}
.stu-card:active{transform:scale(.99)}
.stu-card.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.list-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:10px}
/* ===== 成绩记录：主从（列表→详情） ===== */
.exam-list{display:flex;flex-direction:column;gap:10px}
/* content-visibility：视口外的考试行跳过渲染，长列表滚动不再掉帧 */
.exam-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;
  transition:background .15s,border-color .15s,transform .12s cubic-bezier(.2,.8,.2,1);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  content-visibility:auto;contain-intrinsic-size:auto 68px}
.exam-row:active{background:var(--surface-2);border-color:color-mix(in srgb,var(--brand) 30%,transparent);transform:scale(.985)}
.exam-rank-card .list-item{content-visibility:auto;contain-intrinsic-size:auto 44px}
/* 录入弹窗的长名单：独立滚动容器 + 隔离布局，滚动不牵动整个弹窗重排 */
.exam-entry-list{max-height:38vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;contain:layout paint;padding-right:2px}
.exam-entry-list .list-item{content-visibility:auto;contain-intrinsic-size:auto 46px}
.er-main{flex:1;min-width:0}
.er-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er-meta{font-size:12px;color:var(--muted);margin-top:3px}
.er-stat{display:flex;gap:6px;flex-shrink:0;align-items:center}
.er-arrow{font-size:22px;color:var(--muted);flex-shrink:0;line-height:1}
.back-link{margin-bottom:8px}
.exam-detail-head{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 2px}
.edh{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.edh-k{font-size:11px;color:var(--muted)}
.edh-v{font-weight:700;margin-top:4px;font-size:16px}
.edh-v.brand{color:var(--brand)}
.sc-exc{color:#16a34a}.sc-good{color:var(--brand)}.sc-pass{color:#d97706}.sc-fail{color:var(--danger)}
.score-chart{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:6px 4px}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:#fff;flex-shrink:0;cursor:pointer;background:var(--surface-2)}
.check.on{background:var(--ok);border-color:var(--ok)}
.banner{background:linear-gradient(135deg,#fff4e0,#ffe9d6);border:1px solid #ffd9a8;color:#8a5300;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600;margin-bottom:12px}
[data-theme="dark"] .banner{background:linear-gradient(135deg,#3a2e15,#2e2410);color:#ffce8a;border-color:#5a4416}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-box{background:var(--surface);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px;box-shadow:var(--shadow);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal-box h3{font-size:18px;font-weight:800;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:center;min-height:86px}
.kpi .ico{height:24px;font-size:20px;line-height:24px;display:flex;align-items:center}
.kpi .v{font-size:24px;font-weight:800;margin-top:2px}
.kpi .l{font-size:12px;color:var(--muted);margin-top:2px}
.copy-box{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;white-space:pre-wrap;line-height:1.7}
.kno-list{display:flex;flex-direction:column}
.kno-item{padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.55}
.kno-item:last-child{border-bottom:none}
/* 首页：排行榜手机单列（两列会把头像+姓名+分数挤成一团），宽屏才并排 */
.home-rank{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.home-rank{grid-template-columns:1fr 1fr}}
/* 首页：快捷入口 7 个，最后落单的那个自动拉满整行，不留豁口 */
.home-links{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
.home-links>:last-child:nth-child(3n+1){grid-column:span 3}
.home-links>:last-child:nth-child(3n+2){grid-column:span 2}
/* bottom nav */
.bottomnav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:4px;background:var(--surface);border-top:1px solid var(--line);padding:9px 8px calc(11px + env(safe-area-inset-bottom));z-index:25}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px;font-weight:700;letter-spacing:.5px;color:var(--muted);padding:11px 0;min-height:52px;border-radius:14px;transition:background-color .2s ease,color .2s ease}
.bottomnav button .ico{font-size:24px}
.bottomnav button:active{transform:scale(.96)}
.bottomnav button.active{color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent)}
@media(min-width:1080px){
  .main{padding:18px 22px 24px}
  .topbar .menu-btn{display:none}
  .sidebar{position:relative;transform:none;width:230px}
  .scrim{display:none}
  .bottomnav{display:none}
  .main{padding-bottom:24px}
  .dual .back{display:none!important}
}
@media(max-width:1079px){
  .dual{flex-direction:column}
  .dual-left{width:auto;flex:1 1 auto}
  .dual-right{flex:1 1 auto}
  .dual.show-detail .dual-left{display:none}
  .dual:not(.show-detail) .dual-right{display:none}
  .dual .back{display:flex!important}
}
/* ===== 高级感精修 ===== */
body, .topbar, .sidebar, .card, .kpi, .list-item, .stu-card, .tag, .pill, .tabbar, .banner, .modal-box, .input, .class-card, .log-row{
  transition:background-color .32s ease,color .32s ease,border-color .32s ease;
}
.topbar{
  position:sticky;top:0;z-index:30;
  padding-top:calc(10px + env(safe-area-inset-top));
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  background:color-mix(in srgb,var(--surface) 82%,transparent);
  border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);
}
.bottomnav{
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  background:color-mix(in srgb,var(--surface) 90%,transparent);
}
.card{transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s ease,background-color .32s ease,border-color .32s ease}
.btn{transition:transform .12s,filter .12s,background-color .3s ease}
.star{transition:transform .15s ease}
.star:active{transform:scale(1.3)}
@media(hover:hover){
  .card.hoverable:hover,.kpi:hover,.stu-card:hover,.class-card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(31,39,51,.14)}
  .nav-item:hover{background:var(--surface-3)}
  .btn:hover{filter:brightness(1.06)}
}
.kpi{cursor:default}
.card.hoverable{cursor:pointer}
/* ===== 新增：返回/日历/作业打卡/日志/班级/开关/积分库 ===== */
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap input{padding-left:36px}
.search-wrap .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
/* 日历 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:4px 0}
.cal .day{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;border:1px solid var(--line);font-size:14px;font-weight:600;cursor:pointer;position:relative;background:var(--surface-2)}
.cal .day.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
.cal .day.out{opacity:.32}
.cal .day.sch{border-style:dashed;border-color:var(--brand);color:var(--brand)}
.cal .day.sch.sel{color:#fff;border-style:solid}
.sched-card{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);margin-bottom:12px}
.sched-card .due{margin-left:auto;font-weight:800;color:var(--brand);font-size:15px;white-space:nowrap}
.sched-card .sub{font-size:12px;color:var(--muted);width:100%}
.week-pick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week-pick .wp{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.week-pick .wp:active{transform:scale(.94)}
.week-pick .wp.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(236,72,153,.28)}
.cal .day.today{box-shadow:inset 0 0 0 2px var(--brand)}
.cal .day .dot{position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--brand)}
.cal .day.sel .dot{background:#fff}
/* ===== 作业登记 · 优化排版（iPhone 16 Pro Max 适配） ===== */
.att-list{display:flex;flex-direction:column;gap:10px}
.att-card{display:flex;flex-direction:column;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:var(--surface);transition:border-color .2s,box-shadow .2s,transform .12s}
.att-card:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));box-shadow:0 6px 18px rgba(226,109,151,.10)}
.att-top{display:flex;align-items:center;gap:12px}
.att-top .who{flex:1;min-width:0}
.att-top .who .nn{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-bottom{display:flex;align-items:center;gap:10px}
.att-score{flex:1;min-width:0;font-size:14px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text)}
.att-score::placeholder{color:var(--muted)}
.att-score:focus{outline:none;border-color:color-mix(in srgb,var(--brand) 50%,var(--line));box-shadow:0 0 0 3px var(--brand-soft)}
.att-score::-webkit-outer-spin-button,.att-score::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.att-score{-moz-appearance:textfield}
/* 已交/未交 pill 按钮 */
/* 缺勤原因行：默认隐藏，标记「未到」时即时展开（无需整页重绘） */
.att-card .kq-reason{display:none}
.att-card.absent .kq-reason{display:flex;animation:kqSlide .2s cubic-bezier(.4,0,.2,1)}
@keyframes kqSlide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.att-card.absent{border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.att-toggle{display:flex;gap:8px;flex-shrink:0}
.att-toggle button{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);transition:.15s}
.att-toggle button:hover{filter:brightness(1.03)}
.att-toggle button.on.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 4px 12px rgba(47,158,87,.28)}
.att-toggle button.on.danger{background:var(--danger);border-color:var(--danger);color:#fff;box-shadow:0 4px 12px rgba(210,58,58,.26)}
/* 作业登记 工具栏 */
.att-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.att-toolbar .btn,.att-toolbar .btn.outline-gold{flex:1;min-width:140px}
/* 打卡统计 · 长方形展开条（accordion） */
.acc-bar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .12s}
.acc-bar:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.acc-bar:active{transform:scale(.995)}
.acc-bar .ab-ico{flex:0 0 auto;width:38px;height:38px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:18px}
.acc-bar .ab-main{flex:1;min-width:0}
.acc-bar .ab-title{font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-bar .ab-sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-bar .ab-chev{flex:0 0 auto;font-size:14px;color:var(--text-2);transition:transform .22s cubic-bezier(.4,0,.2,1)}
.acc-bar.open .ab-chev{transform:rotate(180deg)}
.acc-body{overflow:hidden;transition:max-height .3s cubic-bezier(.4,0,.2,1),opacity .25s,margin .25s;max-height:0;opacity:0;margin-top:0}
.acc-body.open{max-height:4000px;opacity:1;margin-top:12px}
/* 通用可折叠统计区块 */
.fold{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);margin:0 0 10px;overflow:hidden;contain:layout style}
.fold-head{display:flex;align-items:center;gap:11px;padding:12px 13px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background .16s}
.fold-head:active{background:var(--brand-soft)}
.fold .fh-ico{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:16px}
.fold .fh-main{flex:1;min-width:0}
.fold .fh-title{font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.fold .fh-sub{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold .fh-val{flex:0 0 auto;font-weight:800;font-size:18px;color:var(--brand);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fold .fh-val small{font-size:11px;font-weight:700;opacity:.75}
.fold .fh-chev{flex:0 0 auto;width:15px;text-align:center;font-size:13px;color:var(--muted);transition:transform .24s cubic-bezier(.4,0,.2,1)}
.fold.open .fh-chev{transform:rotate(180deg)}
.fold-body{overflow:hidden;max-height:0;opacity:0;transition:max-height .3s cubic-bezier(.4,0,.2,1),opacity .2s}
.fold.open .fold-body{max-height:3200px;opacity:1}
.fold-inner{padding:11px 13px 13px;border-top:1px solid var(--line);background:var(--surface-2)}
.fold-tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.fold-scroll{max-height:340px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin:0 -3px;padding:0 3px}
@media(min-width:1080px){.fold-scroll{max-height:480px}}
/* 统计行（紧凑排版，替代 list-item 大卡） */
.srow{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:11px;background:var(--surface);border:1px solid var(--line);margin-bottom:5px;font-size:13px;content-visibility:auto;contain-intrinsic-size:auto 38px}
.srow .sn{font-weight:700;flex:0 0 auto;max-width:34%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sbar{flex:1;min-width:34px;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.srow .sbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand-2),var(--brand));transition:width .4s cubic-bezier(.4,0,.2,1)}
.srow .sv{flex:0 0 auto;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.srow .smeta{flex:0 0 auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.srow.total{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 30%,var(--line));margin-top:8px;margin-bottom:0}
.srow.low .sv{color:var(--danger)}
.srow.low .sbar i{background:linear-gradient(90deg,#f0a0a0,var(--danger))}
/* 作业提交统计 · 学生打卡卡片（与截图一致） */
.hw-card{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.hw-card.total{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 30%,var(--line));font-weight:700}
.hw-card .hw-name{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hw-card .hw-pills{display:flex;gap:7px;flex-shrink:0}
.hw-card .hw-pills .tag{font-size:12px;padding:4px 8px;border-radius:999px;white-space:nowrap}
.hw-card .hw-rate{font-weight:800;font-size:17px;min-width:48px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0}
/* 打卡率 小卡片 */
.rate-pill{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);min-height:74px;text-align:center}
.rate-pill .rp-v{font-size:22px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.rate-pill .rp-l{font-size:11px;color:var(--muted);margin-top:4px}
.rate-pill .rp-sub{font-size:10px;color:var(--text-2);margin-top:2px}
/* 未交作业名单 · 班级行 */
.miss-row{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:10px;cursor:pointer;transition:border-color .15s,transform .1s}
.miss-row:active{transform:scale(.99)}
.miss-row:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.miss-row .mr-badge{flex:0 0 auto;min-width:30px;height:30px;padding:0 8px;border-radius:10px;background:var(--danger);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.miss-detail{font-size:12px;color:var(--text-2);line-height:1.7;padding:4px 2px 8px}
.miss-detail b{color:var(--danger)}
/* 日程安排 · 课表左 / 当天右 双栏布局 */
.sched-2col{display:flex;gap:14px;align-items:flex-start}
.sched-left{flex:1.25;min-width:0}
.sched-right{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-height:120px}
@media(max-width:760px){.sched-2col{flex-direction:column}.sched-left,.sched-right{width:100%;flex:1}}
/* 作业登记 确定按钮 */
.att-foot{margin-top:16px;display:flex;gap:10px;align-items:center}
.att-foot .confirm-btn{flex:1;font-size:15px;font-weight:800;padding:14px 16px;border-radius:13px;background:var(--brand);color:#fff;box-shadow:0 8px 22px rgba(226,109,151,.34);transition:transform .12s,filter .12s}
.att-foot .confirm-btn:hover{filter:brightness(1.05)}
.att-foot .confirm-btn:active{transform:scale(.98)}
/* 开关 */
.switch{width:46px;height:26px;border-radius:99px;background:var(--surface-3);position:relative;transition:.2s;flex-shrink:0;border:none}
.switch.on{background:var(--ok)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on::after{left:23px}
/* 日志 */
.log-row{display:flex;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:13px}
.log-row .meta{color:var(--muted);font-size:12px;flex-shrink:0;width:120px}
.log-row .body{flex:1;min-width:0}
.log-row .delta{font-weight:800;flex-shrink:0}
/* 班级卡片 */
.class-card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s ease}
.class-card .cn{font-weight:800;font-size:16px}
.class-card .cm{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.class-card .acts{display:flex;gap:8px;margin-top:10px}
/* 积分库 */
.plib{display:flex;flex-wrap:wrap;gap:8px}
.plib button{padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface-2)}
.plib button.add{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.plib button.sub{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer;border:1px solid var(--line)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stat-grid .s{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.stat-grid .s .v{font-weight:800;font-size:18px}
.stat-grid .s .l{font-size:11px;color:var(--muted)}
/* ===== 登录 / 注册屏 ===== */
.auth-screen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 82%,rgba(0,0,0,.22));backdrop-filter:saturate(180%) blur(8px);-webkit-backdrop-filter:saturate(180%) blur(8px)}
.auth-card{width:320px;max-width:90vw;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 22px;box-shadow:var(--shadow);text-align:center}
.auth-logo{height:78px;display:flex;justify-content:center;align-items:center;margin-bottom:4px}
.auth-logo img{width:74px;height:74px;border-radius:20px;object-fit:cover;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.auth-card h2{font-size:20px;font-weight:800;margin:6px 0 10px}
/* 云端连接状态徽标：进登录页自动探测，省得用户自己去猜通没通 */
.net-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:4px 11px;margin-bottom:14px}
.net-dot{width:7px;height:7px;border-radius:50%;background:#f59e0b;flex:0 0 auto;animation:netPulse 1.2s ease-in-out infinite}
.net-badge.ok .net-dot{background:#22c55e;animation:none}
.net-badge.bad .net-dot{background:#ef4444;animation:none}
.net-badge.ok{color:#16a34a}
.net-badge.bad{color:var(--danger)}
@keyframes netPulse{0%,100%{opacity:1}50%{opacity:.25}}
.auth-divider{height:1px;background:var(--line);margin:12px 0 10px}
.offline-link{font-size:11px;color:var(--muted);text-decoration:underline;cursor:pointer;text-align:center;padding:4px}
.offline-link:active{opacity:.6}
.auth-tabs{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:14px;margin-bottom:14px}
.auth-tabs button{flex:1;padding:9px;border-radius:10px;font-size:14px;font-weight:700;color:var(--text-2)}
.auth-tabs button.active{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.auth-card .input{margin-bottom:10px;text-align:center}
.auth-hint{font-size:12px;color:var(--danger);min-height:16px;margin-top:8px}
.auth-foot{font-size:11px;color:var(--muted);margin-top:14px}
</style>
</head>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
// 单引号必须一起转义：姓名/班级名里出现 ' 会把 onclick="fn('...')" 的字符串截断，
// 导致整行按钮全部失效（如「O'Brien」「A'班」）
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const fmtDate=d=>{d=new Date(d);return `${d.getMonth()+1}月${d.getDate()}日`;};
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const isoDate=d=>{d=new Date(d);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
// 把任意历史格式（「8月3日」/「2026-8-3」/ Date）统一成 YYYY-MM-DD
// 成绩排序、日期筛选、成绩曲线都依赖可比较的 ISO 字符串，中文日期会让 localeCompare 彻底排错
function toISODate(v){
  if(!v)return '';
  if(v instanceof Date)return isNaN(v.getTime())?'':isoDate(v);
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})\s*[月\/.\-]\s*(\d{1,2})\s*日?$/);
  if(m){
    const now=new Date(),mo=+m[1],da=+m[2];
    if(mo<1||mo>12||da<1||da>31)return '';
    let y=now.getFullYear();
    // 中文日期没有年份，按「最近的过去」推断：算出来比今天晚 60 天以上就判为去年
    if(new Date(y,mo-1,da).getTime()-now.getTime()>60*864e5)y--;
    return `${y}-${String(mo).padStart(2,'0')}-${String(da).padStart(2,'0')}`;
  }
  const d=new Date(s);
  return isNaN(d.getTime())?'':isoDate(d);
}
const STORE='twb_v3';
let state=null;
let formDirty=false;
function load(){try{const r=localStorage.getItem(STORE);if(r){const o=JSON.parse(r);if(o&&o.classes)return o;}}catch(e){}return seed();}
let _pushT=null,_pushPending=false,_uiT=null;
function writeLocal(){if(!state)return;try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}
// 数据类改动：本地立刻落盘，云端合并后再推
function save(){writeLocal();schedulePush();}
// 纯 UI 导航态（选了哪个班 / 展开哪一条）：合并 400ms 再落盘。
// 否则每点一下都要 JSON.stringify 整个 state + 发一次 POST，主线程直接被卡住
function saveUI(){if(_uiT)return;_uiT=setTimeout(()=>{_uiT=null;writeLocal();schedulePush();},400);}
// 连续操作只推最后一次，避免同步风暴
function schedulePush(){if(!API_TOKEN)return;_pushPending=true;if(_pushT)clearTimeout(_pushT);_pushT=setTimeout(()=>{_pushT=null;pushState();},900);}
async function pushState(){ if(!API_TOKEN){_pushPending=false;return;} _pushPending=false; try{ await apiFetch('/api/state',{method:'POST',body:{state:state,data:state}}); }catch(e){} }
// 页面切后台 / 关闭时补推，保证防抖窗口内的改动不丢
function flushSave(){if(!state)return;if(_uiT){clearTimeout(_uiT);_uiT=null;}writeLocal();if(_pushT){clearTimeout(_pushT);_pushT=null;}if(_pushPending)pushState();}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave();});
window.addEventListener('pagehide',flushSave);
const LS_TOKEN='twb_token';
const LS_API='twb_api';
const LS_OFF='twb_offline';
const LS_DK='twb_dk';
const LS_CRED='twb_cred';
let API_TOKEN=localStorage.getItem(LS_TOKEN)||'';
let OFFLINE=localStorage.getItem(LS_OFF)==='1';
let authMode='login';
/* 云端服务器地址：留空=使用当前站点同源 /api（自建部署）；填写=连接你自己的云端后端（静态托管也能云同步） */
/* 内置默认云端地址：装好即用，无需手工填写。想换服务器时在登录页「高级」里改即可 */
const APP_ICON=document.getElementById('authLogo')?document.getElementById('authLogo').src:'';
const DEFAULT_API='https://mocxfageupnk.sealosgzg.site';
function apiBase(){const v=(localStorage.getItem(LS_API)||'').trim().replace(/\/+$/,'');return v||DEFAULT_API;}
function apiURL(p){return apiBase()+p;}
/* ---------- 云端接口兼容层 ----------
   不同后端实现返回格式不一：有的直接返回 {token:...}，有的包一层 {code:200,data:{token:...}}；
   鉴权有的收 ?token= 查询参数，有的只认 Authorization: Bearer 头；
   出错时有的给 4xx 状态码，有的一律 200 只在 body 里写 code。
   下面这一层把这些差异全部抹平，前端业务代码无需关心。 */
function unwrapJson(j){
  if(!j||typeof j!=='object')return j;
  if(j.data!==undefined&&(j.code!==undefined||j.error!==undefined))return j.data;
  return j;
}
function apiErrOf(j,r){
  if(j&&typeof j==='object'){
    if(j.error)return String(j.error);
    if(j.code!==undefined&&Number(j.code)!==200&&Number(j.code)!==0)return String(j.msg||j.message||('服务器返回 '+j.code));
  }
  if(r&&!r.ok)return '服务器返回 '+r.status;
  return '';
}
function isAuthErr(msg,r){
  if(r&&(r.status===401||r.status===403))return true;
  return /未登录|登录已失效|token|令牌|unauthor/i.test(msg||'');
}
function saveCred(u,p){try{localStorage.setItem(LS_CRED,btoa(unescape(encodeURIComponent(JSON.stringify({u:u,p:p})))));}catch(e){}}
function readCred(){try{const s=localStorage.getItem(LS_CRED);if(!s)return null;return JSON.parse(decodeURIComponent(escape(atob(s))));}catch(e){return null;}}
function clearCred(){try{localStorage.removeItem(LS_CRED);}catch(e){}}
/* 令牌失效时静默重登一次：后端多为「单令牌」实现，手机登录会顶掉电脑的令牌，
   靠这段自动续期，两台设备就能一直保持同步而不用手工反复登录。 */
async function silentRelogin(){
  const c=readCred();
  if(!c||!c.u||!c.p)return false;
  try{
    const r=await fetch(apiURL('/api/login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:c.u,password:c.p})});
    const j=await r.json().catch(()=>({}));
    const d=unwrapJson(j);
    const tk=(d&&d.token)||j.token;
    if(!tk)return false;
    API_TOKEN=tk;localStorage.setItem(LS_TOKEN,API_TOKEN);
    return true;
  }catch(e){return false;}
}
/* 统一请求：自动带 Bearer 头 + ?token= 双保险，失效自动重登重试一次 */
async function apiFetch(path,opts,_retried){
  opts=opts||{};
  const headers=Object.assign({'Accept':'application/json'},opts.headers||{});
  if(API_TOKEN)headers['Authorization']='Bearer '+API_TOKEN;
  let body=opts.body;
  if(body&&typeof body!=='string'){headers['Content-Type']='application/json';body=JSON.stringify(body);}
  let url=apiURL(path);
  if(API_TOKEN)url+=(url.indexOf('?')>=0?'&':'?')+'token='+encodeURIComponent(API_TOKEN);
  const r=await fetch(url,{method:opts.method||'GET',headers:headers,body:body});
  let j={};try{j=await r.json();}catch(e){}
  const err=apiErrOf(j,r);
  if(err&&isAuthErr(err,r)&&!_retried&&readCred()){
    if(await silentRelogin())return apiFetch(path,opts,true);
  }
  return {ok:!err,err:err,raw:j,data:unwrapJson(j),status:r.status};
}
async function saveApiBase(){
  const el=document.getElementById('authApi');if(!el)return;
  // 容错：去掉中英文空格、结尾斜杠、误粘贴的 /api 后缀
  let v=el.value.replace(/[\s\u3000]/g,'').replace(/\/+$/,'').replace(/\/api$/i,'');
  if(v&&!/^https?:\/\//i.test(v))v='https://'+v;
  el.value=v;
  if(v)localStorage.setItem(LS_API,v);else localStorage.removeItem(LS_API);
  if(!v){setAuthHint('已改为使用当前站点 /api');return;}
  setAuthHint('正在测试连接…');
  try{
    const r=await fetch(v+'/api/health',{method:'GET',headers:{'Accept':'application/json'}});
    if(r.ok){setAuthHint('✅ 服务器连接正常，可以注册/登录了');return;}
  }catch(e){}
  try{  // 有的后端没有 /api/health，退而用登录接口探活（预期返回「密码错误」也算通）
    const r2=await fetch(v+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'__ping__',password:'__ping__'})});
    if(r2.status<500){setAuthHint('✅ 服务器连接正常，可以注册/登录了');return;}
    setAuthHint('⚠️ 服务器有响应但异常（'+r2.status+'），请稍后再试');
  }catch(e){setAuthHint('❌ 连不上这个地址，请检查是否填错（不要带 /api，不要有空格）');}
}

async function pingCloud(){
  const badge=document.getElementById('netBadge'),txt=document.getElementById('netText');
  if(!badge||!txt)return;
  badge.className='net-badge';txt.textContent='正在连接云端…';
  const base=apiBase();
  const hit=()=>{badge.className='net-badge ok';txt.textContent='云端已连接';};
  const miss=()=>{badge.className='net-badge bad';txt.textContent='云端连不上，可稍后重试';};
  try{
    const r=await fetch(base+'/api/health',{method:'GET',headers:{'Accept':'application/json'}});
    if(r.ok)return hit();
  }catch(e){}
  try{
    const r2=await fetch(base+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'__ping__',password:'__ping__'})});
    if(r2.status<500)return hit();
  }catch(e){}
  miss();
}

function setAuthHint(m){const h=document.getElementById('authHint');if(h)h.textContent=m||'';}
async function ensureState(){
  if(!API_TOKEN){ showAuth(true); return; }
  try{
    const res=await apiFetch('/api/state');
    if(!res.ok){
      if(isAuthErr(res.err,{status:res.status})){ API_TOKEN=''; localStorage.removeItem(LS_TOKEN); showAuth(true); setAuthHint('登录已过期，请重新登录'); return; }
      throw new Error(res.err);
    }
    const d=res.data;
    const remote=(d&&d.state!==undefined)?d.state:d;   // 兼容 {state:{...}} 与直接返回状态对象
    if(remote&&remote.classes&&Object.keys(remote).length){
      state=remote;
      migrateState();   // 关键：云端可能是旧格式 / 缺字段，不清洗直接渲染会白屏
    }
    else { await pushState(); }                        // 云端还没有数据 → 把本机这份传上去
    state.lastSync=Date.now(); save(); render(); renderSync();
  }catch(e){ if(OFFLINE){render();}else{showAuth(true);} toast('未连接云端，当前使用本机数据'); }
}
async function authSubmit(){
  const u=document.getElementById('authUser').value.trim();
  const p=document.getElementById('authPwd').value;
  if(!u||!p){setAuthHint('请填写用户名和密码');return;}
  const path=authMode==='login'?'/api/login':'/api/register';
  setAuthHint(authMode==='login'?'登录中…':'注册中…');
  try{
    const r=await fetch(apiURL(path),{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({username:u,password:p})});
    let j={};try{j=await r.json();}catch(e){}
    const err=apiErrOf(j,r);
    if(err){setAuthHint(err);return;}
    const d=unwrapJson(j);
    const tk=(d&&d.token)||j.token;                    // 兼容 {token} 与 {code,data:{token}}
    if(!tk){setAuthHint('服务器未返回登录令牌，请检查服务器地址是否正确');return;}
    API_TOKEN=tk; localStorage.setItem(LS_TOKEN,API_TOKEN);
    saveCred(u,p);                                     // 记住凭据，令牌被顶掉时自动续期
    setAuthHint(''); showAuth(false); await ensureState();
    toast(authMode==='login'?'登录成功，云端已连接 ✓':'注册成功，数据已上传云端 ✓');
  }catch(e){setAuthHint('连接不上云端服务器：请检查下方「云端服务器地址」，或点击「先在本机使用」');}
}
function switchAuthMode(m){authMode=m;const l=document.getElementById('tabLogin'),r=document.getElementById('tabReg'),b=document.getElementById('authSubmit');if(l)l.classList.toggle('active',m==='login');if(r)r.classList.toggle('active',m==='reg');if(b)b.textContent=m==='login'?'登录':'注册';}
function logout(){
  if(!confirm('确定要退出吗？\n\n本机保存的学生数据不会丢失，下次进来还在。'))return;
  API_TOKEN='';OFFLINE=false;
  localStorage.removeItem(LS_TOKEN);
  clearCred();
  localStorage.removeItem(LS_OFF);   // 关键：不清这个，离线模式会直接跳回主界面，看起来像没反应
  forceCloseModal();toggleSidebar(false);
  showAuth(true);
  const el=document.getElementById('authApi');if(el)el.value=apiBase();
  toast('已退出');
}

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function openModal(html){$('#modalBox').innerHTML=html;formDirty=false;$('#modal').classList.add('show');}

function forceCloseModal(){$('#modal').classList.remove('show');formDirty=false;hideLeaveConfirm();}
let _confirmCb=null;
function confirmModal(title,msg,yesLabel,yesFn){
  _confirmCb=yesFn;
  openModal(`<h3>${esc(title)}</h3><p style="font-size:13px;line-height:1.7;white-space:pre-wrap">${esc(msg)}</p>
    <div class="row" style="gap:8px;margin-top:14px"><button class="btn ghost" style="flex:1" onclick="forceCloseModal()">取消</button><button class="btn" style="flex:1;background:var(--danger);color:#fff" onclick="_runConfirm()">${esc(yesLabel)}</button></div>`);
}
function _runConfirm(){const f=_confirmCb;_confirmCb=null;forceCloseModal();if(typeof f==='function')f();}
function showLeaveConfirm(){hideLeaveConfirm();const ov=document.createElement('div');ov.className='leave-confirm';ov.innerHTML=`<div class="lc-card"><div style="font-weight:700;font-size:16px;margin-bottom:6px">放弃未保存的修改？</div><div style="font-size:13px;color:var(--muted);line-height:1.6">您填写的内容尚未保存，离开后将丢失。</div><div class="row" style="gap:8px;margin-top:14px"><button class="btn ghost" style="flex:1" onclick="hideLeaveConfirm()">继续编辑</button><button class="btn" style="flex:1;background:var(--danger);color:#fff" onclick="hideLeaveConfirm();forceCloseModal()">放弃并离开</button></div></div>`;document.getElementById('modal').appendChild(ov);}

function toggleTheme(){state.theme=state.theme==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',state.theme);$('#themeBtn').textContent=state.theme==='light'?'深色':'浅色';save();}
function toggleOnline(){state.online=!state.online;save();renderSync();if(state.online)syncNow(true);else toast('已切换离线，本地记录待同步');}
function renderSync(){$('#syncPill').classList.toggle('off',!state.online);if(!state.online){$('#syncText').textContent='离线·待同步';return;}$('#syncText').textContent=state.lastSync?('已同步·'+fmtTime(state.lastSync)):'云端已同步';}
function fmtTime(t){const d=new Date(t);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
async function syncNow(silent){
  if(!state.online)return;
  if(!API_TOKEN){if(!silent)toast('本地模式：点右上角 ☁ 登录云端后自动同步');return;}
  try{
    const res=await apiFetch('/api/state',{method:'POST',body:{state:state,data:state}});
    if(!res.ok)throw new Error(res.err||'push');
    state.lastSync=Date.now();
    try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}
    renderSync();
    if(!silent)toast('云端同步完成 ✓');
  }catch(e){if(!silent)toast('云同步暂不可用，已保留本地数据');}
}

// 单个学生对象字段兜底。云端旧数据 / 导入数据经常缺字段，
// 少一个 attLogs 就能让首页整页崩掉，所以统一在这里补齐。
function normStudent(s){
  if(!s||typeof s!=='object')return null;
  if(typeof s.name!=='string'||!s.name.trim())s.name=s.name?String(s.name):'未命名';
  if(!Array.isArray(s.attLogs))s.attLogs=[];
  if(!Array.isArray(s.pointLogs))s.pointLogs=[];
  if(!Array.isArray(s.weak))s.weak=[];
  if(!Array.isArray(s.proTags))s.proTags=[];
  if(!Array.isArray(s.tags))s.tags=[];
  if(!Array.isArray(s.scoreHist))s.scoreHist=[];
  if(typeof s.points!=='number'||!isFinite(s.points))s.points=0;
  if(typeof s.score!=='number'||!isFinite(s.score))s.score=0;
  if(typeof s.rank!=='number'||!isFinite(s.rank))s.rank=0;
  if(s.deleted===undefined)s.deleted=false;
  // 日志数组里的脏元素也要挡掉，否则 forEach 里访问 .date 会炸
  s.attLogs=s.attLogs.filter(l=>l&&typeof l==='object');
  s.pointLogs=s.pointLogs.filter(p=>p&&typeof p==='object');
  s.weak=s.weak.filter(w=>w&&typeof w==='object'&&w.label!=null);
  return s;
}
// 清掉「班级里还挂着、但学生表已彻底删除」的幽灵 id，
// 以及顶层容器的类型异常。这类脏数据是白屏的主要来源。
function sanitizeState(){
  if(!state||typeof state!=='object')return;
  if(!Array.isArray(state.classes))state.classes=[];
  if(!state.students||typeof state.students!=='object')state.students={};
  if(!Array.isArray(state.exams))state.exams=[];
  if(!Array.isArray(state.feedback))state.feedback=[];
  if(!Array.isArray(state.todos))state.todos=[];
  if(!Array.isArray(state.makeups))state.makeups=[];
  if(!state.attendance||typeof state.attendance!=='object')state.attendance={};
  state.classes=state.classes.filter(c=>c&&typeof c==='object'&&c.id!=null);
  state.classes.forEach(c=>{
    if(typeof c.name!=='string')c.name=String(c.name||'未命名班级');
    if(!Array.isArray(c.students))c.students=[];
    // 幽灵 id + 重复 id 一并清掉
    const seen=new Set();
    c.students=c.students.filter(id=>{
      if(id==null||seen.has(id)||!state.students[id])return false;
      seen.add(id);return true;
    });
  });
  Object.keys(state.students).forEach(k=>{ if(!normStudent(state.students[k]))delete state.students[k]; });
  state.exams=state.exams.filter(e=>e&&typeof e==='object');
  state.todos=state.todos.filter(t=>t&&typeof t==='object');
  state.makeups=state.makeups.filter(m=>m&&typeof m==='object');
}

  });
  // V1.5 迁移：旧「作业全对(hwRight)」并入新的「作业积分登记(hwGrade)」，避免重复计分
  allStudents().forEach(s=>{

    });
  });
}

// 只保留分数合法的记录，避免空集算出 -Infinity / NaN 污染整个成绩板块
function recalcExam(ex){
  // 注意 isFinite(null)===true、Number(null)===0，必须显式挡掉 null / 空串，否则缺考会被算成 0 分拉低均分
  const r=(ex.results||[]).filter(x=>{
    if(!x||x.stuId==null)return false;
    const t=typeof x.score;
    if(t!=='number'&&t!=='string')return false;
    if(t==='string'&&x.score.trim()==='')return false;
    return isFinite(Number(x.score));
  }).map(x=>({stuId:x.stuId,score:Number(x.score),rank:0}));
  r.sort((a,b)=>b.score-a.score);
  r.forEach((x,i)=>x.rank=i+1);
  ex.results=r;
  ex.max=r.length?r[0].score:0;
  ex.min=r.length?r[r.length-1].score:0;
  ex.avg=r.length?Math.round(r.reduce((a,x)=>a+x.score,0)/r.length):0;
}

function parseExamDate(d){

  if(d.indexOf('-')>=0){const p=d.split('-');if(p.length===3)return new Date(+p[0],+p[1]-1,+p[2]);}
  const m=d.match(/(\d+)月(\d+)日?/);
  if(m){const now=new Date();return new Date(now.getFullYear(),+m[1]-1,+m[2]);}
  return null;
}

function saveExamEntry(){
  const editId=state._editExamId;
  let exam=editId?state.exams.find(e=>e.id===editId):null;
  if(editId&&!exam){toast('该考试已被删除');forceCloseModal();render();return;}
  const cls=state.classes.find(c=>c.id===state._entryClsId)||examCls();
  if(!cls){toast('班级不存在');return;}
  const results=[];const bad=[];
  (cls.students||[]).forEach(id=>{
    const el=$('#sc_'+id);if(!el)return;
    const raw=el.value.trim();if(raw==='')return;
    const n=Number(raw);
    if(!isFinite(n)||n<0||n>150){bad.push(stuName(id));return;}
    results.push({stuId:id,score:n,rank:0});
  });
  if(bad.length){toast(`分数无效（需 0~150）：${bad.slice(0,3).join('、')}`);return;}
  if(!results.length){toast('请至少录入一个分数');return;}
  const name=$('#exName').value.trim()||'未命名考试';
  const type=$('#exType').value;
  const date=toISODate($('#exDate').value)||todayStr();
  const isEdit=!!exam;
  if(isEdit){exam.name=name;exam.type=type;exam.date=date;exam.results=results;}
  else{exam={id:uid(),clsId:cls.id,name,type,date,results};state.exams.push(exam);}
  recalcExam(exam);
  syncStudentScores(cls);
  state._editExamId=null;state._entryClsId=null;
  save();forceCloseModal();render();
  toast(isEdit?'成绩已更新，班级排名已重算 ✓':'成绩已录入，班级排名已生成 ✓');
}
// 按考试日期重建该班每个学生的 score / scoreHist / rank
// 这样编辑或删除历史成绩后不会残留脏数据；scoreHist 存「本次之前」的成绩，进步判定才成立
function syncStudentScores(cls){
  if(!cls)return;
  const exs=state.exams.filter(e=>e.clsId===cls.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  (cls.students||[]).forEach(id=>{
    const s=state.students[id];if(!s)return;
    const hist=[];
    exs.forEach(e=>{const r=(e.results||[]).find(x=>x.stuId===id);if(r)hist.push(r.score);});
    if(hist.length){s.score=hist[0];s.scoreHist=hist.slice(1,9);}
  });
  const list=(cls.students||[]).map(id=>state.students[id]).filter(Boolean).sort((a,b)=>(b.score||0)-(a.score||0));
  list.forEach((s,i)=>s.rank=i+1);
}

function ruleWrongQ(g,u,weak,count,level){
  count=count||5;const kws=(weak+' '+u.n).toLowerCase();
  const has=(...arr)=>arr.some(a=>kws.includes(a));
  const rng=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
  const qs=[],as=[];const add=(q,a)=>{qs.push(q);as.push(a);};
  if(has('乘')){for(let i=0;i<count;i++){const a=rng(2,9),b=rng(2,9);add(`${a} × ${b} ＝ ?`,a*b);}}
  else if(has('除','整除','倍数','因数')){for(let i=0;i<count;i++){const a=rng(2,9),b=rng(2,9);const p=a*b;add(`${p} ÷ ${a} ＝ ?`,b);}}
  else if(has('分数')){for(let i=0;i<count;i++){const a=rng(1,5),b=rng(a+1,9);add(`计算：${a}/${b} ＋ ${a}/${b} ＝ ?`,`${Math.min(a*2,b)}/${b}`);}}
  else if(has('小数')){for(let i=0;i<count;i++){const a=(rng(1,9)+rng(0,9)/10).toFixed(1),b=(rng(1,9)+rng(0,9)/10).toFixed(1);add(`计算：${a} ＋ ${b} ＝ ?`,(parseFloat(a)+parseFloat(b)).toFixed(1));}}
  else if(has('圆')){for(let i=0;i<count;i++){const r=rng(2,10);add(`圆的半径 ${r} 厘米，求周长（取 3.14）？`,(2*3.14*r).toFixed(2)+' 厘米');}}
  else if(has('周长','面积')){for(let i=0;i<count;i++){const r=rng(2,10);if(has('面积')){const w=rng(2,9);add(`长方形长 ${r} 厘米、宽 ${w} 厘米，求面积？`,r*w+' 平方厘米');}else add(`正方形边长 ${r} 厘米，求周长？`,4*r+' 厘米');}}
  else if(has('百分数','百分')){for(let i=0;i<count;i++){const base=rng(40,200),pct=rng(10,50);add(`${base} 的 ${pct}% 是多少？`,Math.round(base*pct/100));}}
  else if(has('方程','字母')){for(let i=0;i<count;i++){const a=rng(2,9),b=rng(1,20);add(`解方程：${a}x ＝ ${a*b}`,`x ＝ ${b}`);}}
  else if(has('钟表','时间')){for(let i=0;i<count;i++){const h=rng(1,12);add(`现在是 ${h} 时，过 3 小时是几时？`,((h+3-1)%12)+1+' 时');}}
  else if(has('比较','大小')){for(let i=0;i<count;i++){const a=rng(10,99),b=rng(10,99);add(`比较大小：${a} ○ ${b}（填 ＞ ＜ ＝）`,a>b?'＞':'＜');}}
  else if(has('减','退位','连减','混合')){for(let i=0;i<count;i++){const a=rng(10,89),b=rng(10,89);const sm=Math.min(a,b);add(`${Math.max(a,b)} － ${sm} ＝ ?`,Math.max(a,b)-sm);}}
  else if(has('加','进位','连加')){for(let i=0;i<count;i++){const a=rng(10,89),b=rng(10,89);add(`${a} ＋ ${b} ＝ ?`,a+b);}}
  else {for(let i=0;i<count;i++){const a=rng(10,99),b=rng(10,99);if(i%2===0)add(`${a} ＋ ${b} ＝ ?`,a+b);else add(`${Math.max(a,b)} － ${Math.min(a,b)} ＝ ?`,Math.abs(a-b));}}
  let txt='【题目】\n';qs.forEach((q,i)=>txt+=`${i+1}. ${q}\n`);txt+='【答案】\n';as.forEach((a,i)=>txt+=`${i+1}. ${a}\n`);
  return txt.trim();
}

function syncAttDateToMonth(){

// 作业积分登记：按正确率实时核算（全对 +15，每错一题 -1，最低 0），自动同步总积分与积分流水
function applyHwScore(id,wrong){
  const s=stuOf(id);const date=state.attDate;
  let log=s.attLogs.find(x=>x.date===date);
  if(!log){ if(wrong==null) return null; log={date,status:'done',note:''}; s.attLogs.push(log); }
  log.hwWrong=wrong;
  const newPts=wrong==null?null:Math.max(0,15-wrong);
  log.hwPts=newPts;
  const i=s.pointLogs.findIndex(p=>p.src==='hwGrade'&&p.date===date);
  if(newPts==null){ if(i>=0)s.pointLogs.splice(i,1); }
  else if(i>=0){ s.pointLogs[i].pts=newPts; s.pointLogs[i].note='【作业打卡积分】'; }
  else s.pointLogs.unshift({pts:newPts,note:'【作业打卡积分】',src:'hwGrade',date});
  recalcPoints(s);save();
  return newPts;
}
function gradeHw(id,val){
  const wrong=val===''?null:(+val);
  const newPts=applyHwScore(id,wrong);
  if(newPts===undefined)return;
  render();
  const s=stuOf(id);
  if(wrong==null)toast(s.name+' 已清除作业积分登记');
  else toast(s.name+' 作业积分 +'+newPts+(wrong===0?'（全对）':'（错'+wrong+'题）'));
}
function scoreHw(id,pts){
  if(pts===''||pts==null||String(pts).trim()===''||isNaN(pts)){applyHwScore(id,null);return;}
  const wrong=Math.max(0,Math.min(15,15-(+pts)));
  applyHwScore(id,wrong);
}
function markAllDone(){const cls=curClass();const date=state.attDate;cls.students.forEach(id=>{const s=stuOf(id);const ex=s.attLogs.find(x=>x.date===date);if(ex)ex.status='done';else s.attLogs.push({date,status:'done',note:''});});save();render();toast('已标记全班已交 ✓');}
function canHwFull(s){if(!s)return false;const m=state.attMonth,y=new Date().getFullYear();const recs=(s.attLogs||[]).filter(l=>{if(!l)return false;const d=new Date(l.date);return d.getFullYear()===y&&d.getMonth()===m;});if(!recs.length)return false;return recs.every(r=>r.status==='done');}
function awardHwFull(id){const s=stuOf(id);if(!canHwFull(s)){toast(s.name+' 本月未全勤提交');return;}if(s.pointLogs.some(p=>p.src==='hwFull'&&p.date===fmtDate(new Date()))){toast(s.name+' 本月全勤奖已发放');return;}s.pointLogs.unshift({pts:50,note:'「本月作业全勤奖」',src:'hwFull',date:fmtDate(new Date())});recalcPoints(s);save();render();toast(s.name+' 作业全勤 +50 🏆');}

function buildCalendar(){
  const y=new Date().getFullYear();const m=state.attMonth;
  const startDow=new Date(y,m,1).getDay();const days=new Date(y,m+1,0).getDate();
  const wd=['日','一','二','三','四','五','六'];
  const cc=curClass();
  const schSet=new Set(classDays(cc,`${y}-${String(m+1).padStart(2,'0')}-01`,`${y}-${String(m+1).padStart(2,'0')}-${String(days).padStart(2,'0')}`).filter(ds=>(!cc.startDate||ds>=cc.startDate)&&(!cc.endDate||ds<=cc.endDate)));
  let html=wd.map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<startDow;i++)html+=`<div class="day out"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=clsStudents(curClass()).some(s=>(s.attLogs||[]).some(l=>l&&l.date===ds));

}
// ---------- 上课日程 / 应交次数自动计算 ----------
const WD_CN=['日','一','二','三','四','五','六'];
function classWeekDays(c){
  if(c&&Array.isArray(c.sched)&&c.sched.length)return [...new Set(c.sched.map(s=>s.wd))].sort((a,b)=>a-b);
  return (c&&Array.isArray(c.weekDays)&&c.weekDays.length)?c.weekDays.slice().sort((a,b)=>a-b):[];
}
function weekDaysText(c){const w=classWeekDays(c);return w.length?('每周'+w.map(d=>WD_CN[d]).join('、')+' 上课'):'未设置上课星期';}
function extractTime(t){if(!t)return '';let m=String(t).match(/\d{1,2}[:：]\d{2}\s*[-–至]\s*\d{1,2}[:：]\d{2}/);if(m)return m[0].replace('：',':');m=String(t).match(/\d{1,2}[:：]\d{2}/);return m?m[0].replace('：',':'):'';}
function classSchedText(c){if(c&&Array.isArray(c.sched)&&c.sched.length)return c.sched.map(s=>`${WD_CN[s.wd]} ${extractTime(s.time)||'时段'}`).join(' · ');return weekDaysText(c);}
function clsShort(c){const s=(c&&c.name||'');const n=s.match(/(\d+)\s*班/);if(n)return n[1]+'班';const m=s.match(/(\d+)/);return m?(m[1]+'班'):s;}
function parseD(s){if(!s)return null;const p=String(s).split('-').map(Number);if(p.length<3||!p[0]||isNaN(p[0]))return null;const d=new Date(p[0],p[1]-1,p[2]);return isNaN(d.getTime())?null:d;}
function fmtD(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
/* 统计 from~to（含端点）之间落在「每周上课星期」上的所有上课日 */
function classDays(c,from,to){
  const w=classWeekDays(c);if(!w.length)return [];
  const a=parseD(from),b=parseD(to);if(!a||!b||a>b)return [];
  const out=[];const d=new Date(a.getTime());let guard=0;
  while(d<=b&&guard++<3660){if(w.includes(d.getDay()))out.push(fmtD(d));d.setDate(d.getDate()+1);}
  return out;
}
/* 累计应交：完全由「我决定的日期课程」确定 —— 开课起始日 → 结课日（按上课星期全量统计）；未设结课日时计至今天 */
function classDueDates(c){
  if(!c||!c.startDate||!classWeekDays(c).length)return [];
  let end=(c.endDate&&parseD(c.endDate))?c.endDate:todayStr();
  if(parseD(end)<parseD(c.startDate))end=c.startDate;
  return classDays(c,c.startDate,end);
}
function classDueCount(c){return classDueDates(c).length;}
/* 某真实日期当天有课的班级（需落在开课日期范围内） */
function classesOnDate(ds){
  const d=parseD(ds);if(!d)return [];
  const wd=d.getDay();
  return state.classes.filter(c=>{
    if(!classWeekDays(c).includes(wd))return false;
    if(c.startDate&&ds<c.startDate)return false;
    if(c.endDate&&ds>c.endDate)return false;
    return true;
  });
}
/* 某班级在某日期的时段列表（支持同天多时段） */
function schedForDate(c,ds){
  const wd=parseD(ds).getDay();
  let arr=(c&&Array.isArray(c.sched)&&c.sched.length)?c.sched.filter(s=>s.wd===wd):[];
  if(!arr.length)arr=[{wd,time:(c&&c.timeSlot)||''}];
  return arr.map(s=>({time:extractTime(s.time)||'时段'}));
}
/* 当前周周一（含今日所在周，周一为首） */
function schedMonday(ds){const d=parseD(ds)||new Date();const back=(d.getDay()+6)%7;const m=new Date(d);m.setDate(d.getDate()-back);m.setHours(0,0,0,0);return fmtD(m);}
function schedShift(n){
  const d=parseD(state.schedAnchor);d.setDate(d.getDate()+7*n);
  state.schedAnchor=fmtD(d);
  // 翻周后自动选中：本周就选今天，其它周选该周周一
  const t=todayStr(),mon=state.schedAnchor;

  state.schedSelDate=(t>=mon&&t<=sun)?t:mon;
  save();render();
}
/* 日历只选日期，不跳转 —— 防止手滑误触进考勤 */

function schedBackToday(){state.schedAnchor=schedMonday(todayStr());state.schedSelDate=todayStr();save();render();}
/* 首页「近期上课」：未来 N 天每日每时段 */
function homeUpcoming(n){
  const t=todayStr();const seen=new Set();const list=[];
  state.classes.forEach(c=>{classDueDates(c).forEach(d=>{if(d>=t&&!seen.has(d+c.id)){seen.add(d+c.id);schedForDate(c,d).forEach(sl=>list.push({date:d,cls:c,time:sl.time}));}});});
  list.sort((a,b)=>a.date.localeCompare(b.date));
  return list.slice(0,n);
}

/* 累计打卡统计（开课至今，自动计算，历史数据保留） */
function hwTotalStats(cls){
  const dates=classDueDates(cls);const set=new Set(dates);const total=dates.length;
  return cls.students.map(id=>{const s=stuOf(id);
    const done=(s.attLogs||[]).filter(l=>l&&set.has(l.date)&&l.status==='done').length;
    const miss=Math.max(0,total-done);
    return {s,done,miss,total,rate:total?Math.round(done/total*100):0};});
}
/* 本月应交日期：按上课星期自动生成（未配置星期时回退到历史打卡日期，兼容旧数据） */
function hwMonthDates(cls){
  const y=new Date().getFullYear(),m=state.attMonth;
  const mm=String(m+1).padStart(2,'0');
  const first=`${y}-${mm}-01`;
  let last=`${y}-${mm}-${String(new Date(y,m+1,0).getDate()).padStart(2,'0')}`;
  const t=todayStr();if(last>t)last=t;
  if(classWeekDays(cls).length){
    let from=first;
    if(cls.startDate&&cls.startDate>from)from=cls.startDate;
    if(cls.endDate&&cls.endDate<last)last=cls.endDate;
    return classDays(cls,from,last);
  }
  const set=new Set();clsStudents(cls).forEach(s=>(s.attLogs||[]).forEach(l=>{const d=new Date(l.date);if(d.getFullYear()===y&&d.getMonth()===m)set.add(l.date);}));
  return [...set].sort();
}
/* 本月应交日期（不截断到今天）—— 用于「打卡率」分母：当月应提交的作业打卡总次数，
   包含本月尚未到来的上课日。未来日无法提交，不影响「已交」分子，只用于扩大「应提交」分母，
   从而得到：打卡率 = 当月已交(全班) ÷ 当月应交(全班)。 */
function hwMonthDatesFull(cls){
  const y=new Date().getFullYear(),m=state.attMonth;
  const mm=String(m+1).padStart(2,'0');
  const first=`${y}-${mm}-01`;
  let last=`${y}-${mm}-${String(new Date(y,m+1,0).getDate()).padStart(2,'0')}`;
  if(classWeekDays(cls).length){
    let from=first;
    if(cls.startDate&&cls.startDate>from)from=cls.startDate;
    if(cls.endDate&&cls.endDate<last)last=cls.endDate;
    return classDays(cls,from,last);
  }
  const set=new Set();clsStudents(cls).forEach(s=>(s.attLogs||[]).forEach(l=>{const d=new Date(l.date);if(d.getFullYear()===y&&d.getMonth()===m)set.add(l.date);}));
  return [...set].sort();
}
function hwMonthStats(cls){
  const dates=hwMonthDates(cls);const set=new Set(dates);const total=dates.length;
  return cls.students.map(id=>{const s=stuOf(id);const done=(s.attLogs||[]).filter(l=>l&&set.has(l.date)&&l.status==='done').length;const miss=Math.max(0,total-done);return {s,done,miss,total,rate:total?Math.round(done/total*100):0};});
}
/* 某窗口（一组上课日）内，班级作业打卡率：应提交 = 上课日数 × 在读人数，已交 = 状态为「已交」的人次 */
function hwRateForWindow(cls,dates){
  const stu=clsStudents(cls);
  if(!dates||!dates.length||!stu.length)return {expected:0,done:0,rate:0,dates:0};
  const set=new Set(dates);let done=0;
  stu.forEach(s=>{(s.attLogs||[]).forEach(l=>{if(l&&set.has(l.date)&&l.status==='done')done++;});});
  const expected=dates.length*stu.length;
  return {expected,done,rate:expected?Math.round(done/expected*100):0,dates:dates.length};
}
/* 当天 / 本周 的上课日集合（用于班级打卡率） */
function hwTodayDates(cls){const t=todayStr();const a=classDays(cls,t,t);return a;}
function hwWeekDates(cls){const mon=schedMonday(todayStr());const sun=fmtD(new Date(parseD(mon).getTime()+6*864e5));return classDays(cls,mon,sun);}
// 基于当前所选日期（state.attDate）的日/周窗口，用于「班级总打卡率」即时汇总
function hwDayDates(cls){return classDays(cls,state.attDate,state.attDate);}
function hwWeekDatesAt(cls,date){const mon=schedMonday(date);const sun=fmtD(new Date(parseD(mon).getTime()+6*864e5));return classDays(cls,mon,sun);}
/* 汇总所有班级 · 当月作业打卡率（跟随作业打卡页的月份选择 state.attMonth） */
function allClassHwMonthAgg(){
  const rows=[];let te=0,td=0;
  state.classes.forEach(c=>{
    const dates=hwMonthDatesFull(c);
    const r=hwRateForWindow(c,dates);
    te+=r.expected;td+=r.done;
    rows.push({cls:c,expected:r.expected,done:r.done,rate:r.expected?r.rate:null,dates:r.dates});
  });
  return {rows,totalExpected:te,totalDone:td,totalRate:te?Math.round(td/te*100):0};
}
/* 汇总所有班级 · 本周（自然周 周一~周日，基于今天）作业打卡率 */
function allClassHwWeekAgg(){
  const mon=schedMonday(todayStr());
  const sun=fmtD(new Date(parseD(mon).getTime()+6*864e5));
  const rows=[];let te=0,td=0;
  state.classes.forEach(c=>{
    let from=mon,last=sun;
    if(c.startDate&&c.startDate>from)from=c.startDate;
    if(c.endDate&&c.endDate<last)last=c.endDate;
    const dates=classDays(c,from,last);
    const r=hwRateForWindow(c,dates);
    te+=r.expected;td+=r.done;
    rows.push({cls:c,expected:r.expected,done:r.done,rate:r.expected?r.rate:null,dates:r.dates});
  });
  return {rows,totalExpected:te,totalDone:td,totalRate:te?Math.round(td/te*100):0,weekStart:mon,weekEnd:sun};
}
/* 全部班级打卡率（本周 / 当月）通用卡片：打卡率 = 已交人次 ÷ 应提交人次 */
function allClassHwRateCard(agg,title,sub,onExport){
  const rows=agg.rows.map(r=>({name:r.cls.name,expected:r.expected,done:r.done,rate:r.rate}));
  const total=agg.rows.length?{name:'全部班级汇总',expected:agg.totalExpected,done:agg.totalDone,rate:agg.totalRate}:null;
  const table=rateTable(['班级','应提交','已交','打卡率'],rows,total,{empty:'还没有班级设置上课星期'});
  return statCard(title,sub,table,`<button class="btn sm" onclick="${onExport}">导出</button>`);
}
function missHwByClass(){
  const out=[];
  state.classes.forEach(c=>{
    const dates=hwMonthDates(c);
    if(!dates.length||!c.students.length)return;
    const rows=[];
    c.students.forEach(id=>{
      const missDates=dates.filter(d=>attStatusOf(id,d)!=='done');
      if(missDates.length)rows.push({s:state.students[id],miss:missDates.length,dates:missDates});
    });
    if(rows.length)out.push({cls:c,rows});
  });
  return out;
}

/* ---------- 通用可折叠统计区块 ---------- */
function foldOpen(k){return !!(state.folds&&state.folds[k]);}
function foldToggle(k){
  if(!state.folds)state.folds={};
  state.folds[k]=!state.folds[k];
  const el=document.getElementById('fold-'+k);
  if(el)el.classList.toggle('open',state.folds[k]);
  saveUI();
}
/* k=唯一键 ico=图标 title=标题 sub=摘要 val=右侧大数字 body=内容 tools=顶部按钮组 */
function foldBlock(k,ico,title,sub,val,body,tools){
  const on=foldOpen(k);
  return `<div class="fold ${on?'open':''}" id="fold-${k}">
    <div class="fold-head" onclick="foldToggle('${k}')">
      <div class="fh-ico">${ico}</div>
      <div class="fh-main"><div class="fh-title">${title}</div><div class="fh-sub">${sub}</div></div>
      ${val?`<div class="fh-val">${val}</div>`:''}
      <div class="fh-chev">▾</div>
    </div>
    <div class="fold-body"><div class="fold-inner">${tools?`<div class="fold-tools">${tools}</div>`:''}${body}</div></div>
  </div>`;
}
/* 常驻统计卡（不折叠，直接展示，避免点开不连贯）*/
function statCard(title,sub,body,tools){
  return `<div class="section-head" style="margin-top:22px"><h2>${title}</h2>${sub?`<span class="tag">${sub}</span>`:''}${tools?`<span style="margin-left:auto">${tools}</span>`:''}</div>
  <div class="card" style="padding:12px">${body}</div>`;
}
/* 通用统计表格模板：名称 / 应提交 / 已交 / 打卡率（累计作业打卡、全部班级打卡率 共用此模板）
   rows: [{name,expected,done,rate}]；total: {name,expected,done,rate} 或 null */
function rateTable(headers, rows, total, opts){
  opts=opts||{};
  const rc=r=>(r.rate==null||r.rate==='—')?'var(--muted)':(r.rate>=80?'var(--ok)':r.rate>=60?'var(--gold)':'var(--danger)');
  const cell=(v,extra)=>`<td style="text-align:center;padding:8px 10px;border:1px solid var(--line)${extra?';'+extra:''}">${v}</td>`;
  const tr=r=>`<tr>
    <td style="font-weight:600;padding:8px 10px;border:1px solid var(--line)">${esc(r.name)}</td>
    ${cell(r.expected)}
    ${cell(r.done,'color:var(--ok);font-weight:600')}
    ${cell(r.rate==null?'—':r.rate+'%','color:'+rc(r)+';font-weight:700')}
  </tr>`;
  const th=headers.map((h,i)=>`<th style="text-align:${i===0?'left':'center'};padding:8px 10px;border:1px solid var(--line);border-bottom:2px solid var(--line);color:var(--muted);font-weight:700">${h}</th>`).join('');
  return `<div style="overflow:auto;-webkit-overflow-scrolling:touch"><table style="border-collapse:collapse;width:100%;min-width:340px;font-size:13px">
    <thead><tr>${th}</tr></thead>
    <tbody>
      ${rows.length?rows.map(tr).join(''):`<tr><td colspan="${headers.length}" style="text-align:center;padding:14px;color:var(--muted)">${opts.empty||'暂无数据'}</td></tr>`}
      ${total?`<tr style="background:var(--surface-2)"><td style="font-weight:700;padding:8px 10px;border:1px solid var(--line)">${esc(total.name)}</td>${cell(total.expected)}${cell(total.done,'color:var(--ok);font-weight:600')}${cell(total.rate+'%','font-weight:700')}</tr>`:''}
    </tbody>
  </table></div>`;
}
/* 紧凑统计行：姓名 · 已交/应交 · 进度条 · 百分比 */
function srow(name,done,total,rate,isTotal){
  const r=(rate==null||isNaN(rate))?null:Math.max(0,Math.min(100,rate));
  return `<div class="srow ${isTotal?'total':''} ${(r!=null&&r<60&&!isTotal)?'low':''}">`
    +`<span class="sn">${esc(name)}</span>`
    +`<span class="smeta">${done}/${total}</span>`
    +`<span class="sbar"><i style="width:${r==null?0:r}%"></i></span>`
    +`<span class="sv">${r==null?'—':r+'%'}</span></div>`;
}
/* 作业打卡统计 · 单学生卡片：姓名 + 应交/已交/未交 标签 + 百分比 */
function hwCard(name,total,done,miss,rate,isTotal){
  const r=(rate==null||isNaN(rate))?null:Math.max(0,Math.min(100,rate));
  const rateColor=r==null?'var(--muted)':r>=80?'var(--ok)':r>=60?'var(--gold)':'var(--danger)';
  return `<div class="hw-card ${isTotal?'total':''}">`
    +`<span class="hw-name">${esc(name)}</span>`
    +`<span class="hw-pills">`
      +`<span class="tag gray">应交 ${total}</span>`
      +`<span class="tag ok">已交 ${done}</span>`
      +`<span class="tag danger">未交 ${miss}</span>`
    +`</span>`
    +`<span class="hw-rate" style="color:${rateColor}">${r==null?'—':r+'%'}</span>`
  +`</div>`;
}
function confirmAttendance(){
  const cls=curClass();let done=0,miss=0;

  const exp=(inTerm&&classDays(cls,date,date).length)?cls.students.length:0;

function kqShiftStr(ds,n){const d=parseD(ds);d.setDate(d.getDate()+n);return fmtD(d);}
function exportKqRoster(){
  const cls=curClass();
  const rows=[['学生姓名','累计到课','累计缺勤','出勤率','请假明细（日期·类型）']];
  cls.students.forEach(id=>{
    let p=0,a=0;const recs=[];
    Object.keys(state.attendance).forEach(k=>{if(!k.startsWith(cls.id+'::'))return;const d=k.split('::')[1];const r=state.attendance[k][id];if(r&&r.status==='present')p++;else if(r&&r.status==='absent'){a++;recs.push(kqMD(d)+'·'+(r.reason||'未填'));}});
    const rate=(p+a)?Math.round(p/(p+a)*100):0;
    rows.push([stuName(id),p,a,rate+'%',recs.join(' ')]);
  });
  exportSheet(`${cls.name}-考勤名单.xlsx`,rows);
}
/* 所有班级缺勤人员（跨班汇总，仿作业未交名单） */
function allAbsentByClass(){
  const out=[];
  state.classes.forEach(c=>{
    const rows=[];
    clsStudents(c).forEach(s=>{
      const recs=[];
      Object.keys(state.attendance).forEach(k=>{
        if(!k.startsWith(c.id+'::'))return;
        const d=k.split('::')[1];const r=state.attendance[k][s.id];
        if(r&&r.status==='absent')recs.push({date:d,reason:r.reason||'未填'});
      });
      if(recs.length)rows.push({s,recs});
    });
    if(rows.length)out.push({cls:c,rows});
  });
  out.sort((a,b)=>b.rows.reduce((x,y)=>x+y.recs.length,0)-a.rows.reduce((x,y)=>x+y.recs.length,0));
  return out;
}
/* 点击缺勤名单里的班级 → 弹窗看该班具体谁哪天缺勤（含病假/事假/旷课） */
function absDrill(clsId){
  const c=state.classes.find(x=>x.id===clsId);if(!c)return;
  const g=allAbsentByClass().find(x=>x.cls.id===clsId);
  const html=g?g.rows.map(x=>`<div class="list-item" style="margin:0 0 6px;flex-wrap:wrap;align-items:flex-start"><span style="font-weight:600">${esc(x.s.name)}</span><span class="tag danger" style="margin-left:6px">缺勤 ${x.recs.length} 次</span><span style="margin-left:auto;font-size:12px;color:var(--muted);text-align:right">${x.recs.map(r=>kqMD(r.date)+'·'+esc(r.reason)).join('、')}</span></div>`).join(''):'<div class="empty">该班暂无缺勤记录</div>';
  openModal(`<h3>📋 ${esc(c.name)} · 缺勤人员</h3>
    <div style="margin:10px 0 14px;display:flex;gap:8px"><button class="btn sm" onclick="exportAllAbsent()">⬇️ 导出全部</button><button class="btn ghost sm" onclick="forceCloseModal()">关闭</button></div>

}
/* 导出：所有班级缺勤人员（含病假/事假/旷课） */

function scoreChartSVG(hist){
  if(hist.length<2)return '';
  const W=300,H=132,padL=24,padR=12,padT=12,padB=20;
  const iw=W-padL-padR, ih=H-padT-padB;
  const xs=i=> padL + (hist.length===1?iw/2 : i*iw/(hist.length-1));
  const sc=hist.map(h=>h.score);
  const min=Math.min(...sc), max=Math.max(...sc);
  const lo=Math.max(0,Math.floor((min-8)/10)*10);
  const hi=Math.min(100,Math.ceil((max+8)/10)*10)||100;
  const y=v=> padT + ih - (v-lo)/((hi-lo)||1)*ih;
  const pts=hist.map((h,i)=>`${xs(i).toFixed(1)},${y(h.score).toFixed(1)}`).join(' ');
  const area=`<polygon points="${padL},${padT+ih} ${pts} ${padL+iw},${padT+ih}" style="fill:var(--brand);opacity:.08"/>`;
  const line=`<polyline points="${pts}" style="fill:none;stroke:var(--brand);stroke-width:2;stroke-linejoin:round"/>`;
  const dots=hist.map((h,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${y(h.score).toFixed(1)}" r="3.2" style="fill:var(--brand);stroke:#fff;stroke-width:1"/>`).join('');
  const yl=v=>`<text x="3" y="${(y(v)+3).toFixed(1)}" style="fill:var(--muted);font-size:9">${v}</text>`;
  const xl=i=>{const d=parseD(hist[i].date);const t=d?`${d.getMonth()+1}/${d.getDate()}`:(hist[i].date||'');return `<text x="${xs(i).toFixed(1)}" y="${H-6}" style="fill:var(--muted);font-size:8.5" text-anchor="middle">${esc(t)}</text>`;};
  const xlabels = hist.length<=6 ? hist.map((_,i)=>xl(i)).join('') : (xl(0)+xl(Math.floor((hist.length-1)/2))+xl(hist.length-1));
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" preserveAspectRatio="xMidYMid meet">${area}${line}${dots}${yl(lo)}${yl(hi)}${xlabels}</svg>`;
}
