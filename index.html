const FIELDS=[['name','学生姓名'],['phone','手机号码'],['cls','班级名称'],['lessons','剩余课时'],['points','当前积分'],['weak','薄弱知识点'],['score','考试分数'],['note','备注']];
function guessHeader(h){h=String(h).toLowerCase();if(/姓名|名字|学生/.test(h))return'name';if(/手机|电话|号码|联系/.test(h))return'phone';if(/班级/.test(h))return'cls';if(/课时|剩余/.test(h))return'lessons';if(/积分/.test(h))return'points';if(/薄弱|错题|知识点/.test(h))return'weak';if(/分数|成绩|得分/.test(h))return'score';if(/备注/.test(h))return'note';return'';}
function parseCSV(text){const rows=text.split(/\r?\n/).filter(l=>l.trim());if(!rows.length)return[];const sp=l=>l.split(/[,\t;]/).map(c=>c.trim());const headers=sp(rows[0]);return rows.slice(1).map(r=>{const c=sp(r);const o={};headers.forEach((h,i)=>o[h]=c[i]||'');return o;});}
let sheetLoaded=false;function loadSheetJS(cb){if(window.XLSX)return cb();if(sheetLoaded)return;const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=cb;s.onerror=()=>toast('Excel组件加载失败，请用CSV');sheetLoaded=true;document.head.appendChild(s);}
function handleFile(input){const f=input.files[0];if(!f)return;const name=f.name.toLowerCase();const st=$('#importStatus');if(st)st.textContent='解析中…';const reader=new FileReader();reader.onload=e=>{if(name.endsWith('.csv')||name.endsWith('.txt')){processImport(parseCSV(e.target.result));}else{loadSheetJS(()=>{try{const wb=XLSX.read(e.target.result,{type:'binary'});const sh=wb.Sheets[wb.SheetNames[0]];processImport(XLSX.utils.sheet_to_json(sh,{defval:''}));}catch(err){toast('解析失败：'+err.message);}});}};if(name.endsWith('.csv')||name.endsWith('.txt'))reader.readAsText(f);else reader.readAsBinaryString(f);}
function processImport(rows){if(!rows.length){toast('未读到数据');return;}pendingImport=rows;const headers=Object.keys(rows[0]);const guesses=headers.map(h=>guessHeader(h));openModal(`<h3>确认字段映射（${rows.length} 行）</h3><div style="max-height:50vh;overflow:auto">${headers.map((h,i)=>`<div class="field"><label>${esc(h)}</label><select class="input map-sel" data-h="${esc(h)}">${'<option value="">— 不导入 —</option>'+FIELDS.map(f=>`<option value="${f[0]}" ${guesses[i]===f[0]?'selected':''}>${f[1]}</option>`).join('')}</select></div>`).join('')}</div><button class="btn" style="width:100%" onclick="confirmImport()">下一步：校验数据</button>`);}
function confirmImport(){
  const map={};$$('.map-sel').forEach(s=>{if(s.value)map[s.dataset.h]=s.value;});
  const errors=[];const rows2=[];
  pendingImport.forEach((r,i)=>{const o={};Object.keys(map).forEach(h=>o[map[h]]=r[h]);const rowNum=i+2;
    if(!o.name||!o.cls){errors.push(`第${rowNum}行【${o.name||'未知'}】缺少必填字段（学生姓名、班级名称为必填）`);return;}
    if(o.lessons!==''&&o.lessons!=null&&(isNaN(+o.lessons)||+o.lessons<0)){errors.push(`第${rowNum}行剩余课时格式异常（应为≥0数字）`);return;}
    if(o.phone&&!/^1\d{10}$/.test(String(o.phone))){errors.push(`第${rowNum}行手机号格式异常（应为11位手机号）`);return;}
    rows2.push({o,rowNum});});
  if(errors.length===pendingImport.length){openModal(`<h3>导入失败</h3><div class="copy-box">${errors.join('\n')}</div><button class="btn" style="width:100%;margin-top:10px" onclick="closeModal()">我知道了</button>`);return;}
  const dups=rows2.filter(({o})=>{const cls=state.classes.find(c=>c.name.trim()===String(o.cls).trim());return Object.values(state.students).some(s=>{if(o.phone&&s.phone&&s.phone===String(o.phone))return true;if(!o.phone&&cls&&s.clsId===cls.id&&s.name.trim()===String(o.name).trim())return true;return false;});});
  if(dups.length){pendingMap=map;pendingRows=rows2;pendingErrors=errors;openModal(`<h3>检测到重复手机号</h3><p style="margin-bottom:10px">${dups.length} 个手机号已存在于系统，重复行如何处理？</p><div class="row" style="gap:8px"><button class="btn" onclick="runImport('overwrite')">全部覆盖</button><button class="btn ghost" onclick="runImport('skip')">全部跳过重复</button></div>`);return;}
  runImport('skip',map,rows2,errors);
}
function runImport(strategy,map,rows2,errors){
  map=map||pendingMap;rows2=rows2||pendingRows;errors=errors||pendingErrors;
  let added=0,updated=0,skipped=0;
  rows2.forEach(({o})=>{
    let cls=state.classes.find(c=>c.name.trim()===String(o.cls).trim());
    if(!cls){cls={id:uid(),name:String(o.cls).trim(),startDate:'',endDate:'',timeSlot:'',weekDays:[],students:[]};state.classes.push(cls);}
    const exist=Object.values(state.students).find(s=>{if(o.phone&&s.phone&&s.phone===String(o.phone))return true;if(!o.phone&&s.clsId===cls.id&&s.name.trim()===String(o.name).trim())return true;return false;});
    const weakRaw=o.weak?String(o.weak).split(/[、,，;；]/).filter(Boolean):[];
    const weakArr=weakRaw.map(l=>({label:l.trim(),lv:1}));
    const unknown=weakArr.filter(w=>!ALL_TAGS.includes(w.label)).map(w=>w.label);
    if(exist){
      if(strategy==='skip'){skipped++;return;}
      const before=exist.lessons;exist.name=o.name;exist.clsId=cls.id;
      if(o.phone)exist.phone=String(o.phone);
      exist.lessons=(o.lessons!==''&&o.lessons!=null)?+o.lessons:exist.lessons;exist.points=(o.points!=null&&o.points!=='')?+o.points:exist.points;
      exist.weak=weakArr;exist.tags=weakArr.map(w=>w.label);
      if(o.score)exist.score=+o.score;
      if(unknown.length)exist.remark=(exist.remark?exist.remark+'；':'')+'薄弱:'+unknown.join('、');
      if(!cls.students.includes(exist.id))cls.students.push(exist.id);
      pushLessonLog(exist,before,exist.lessons,'Excel导入-覆盖更新');updated++;return;
    }
    const sid=uid();
    const ns={id:sid,clsId:cls.id,name:o.name,phone:o.phone?String(o.phone):'',score:o.score?+o.score:0,rank:0,
      weak:weakArr,tags:weakArr.map(w=>w.label),proTags:[],points:(o.points!=null&&o.points!=='')?+o.points:0,
      pointLogs:[],lessons:(o.lessons!==''&&o.lessons!=null)?+o.lessons:0,comm:0,commNote:'',renewed:false,attLogs:[],lessonLogs:[],
      scoreHist:o.score?[+o.score]:[],remark:unknown.length?('薄弱:'+unknown.join('、')):(o.note||'')};
    state.students[sid]=ns;cls.students.push(sid);
    pushLessonLog(ns,0,+o.lessons,'Excel导入-初始课时');added++;
  });
  state.classes.forEach(c=>{const list=clsStudents(c).sort((a,b)=>b.score-a.score);list.forEach((s,i)=>s.rank=i+1);});
  save();forceCloseModal();render();
  toast(`导入完成：新增 ${added} · 覆盖 ${updated} · 跳过 ${skipped}${errors.length?` · 失败 ${errors.length}`:''}`);
}

    if(!r.ok)throw new Error('DeepSeek 返回 '+r.status);
    const j=await r.json();
    const t=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
    if(!t||!t.trim())throw new Error('AI 返回为空');
    return t.trim();
  }
  const res=await apiFetch('/api/ai',{method:'POST',body:{system:system,user:user,prompt:user}});
  if(!res.ok)throw new Error('AI 服务：'+(res.err||'调用失败'));
  const d=res.data;
  const t=(typeof d==='string')?d:(d&&(d.text||d.content||d.reply||d.answer));
  if(!t||!String(t).trim())throw new Error('AI 返回为空');
  return String(t).trim();
}

function sumData(cls){
  const wc={};clsStudents(cls).forEach(s=>(s.weak||[]).forEach(w=>{if(w&&w.label)wc[w.label]=(wc[w.label]||0)+1;}));
  const topWeak=Object.entries(wc).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
  const sorted=[...cls.students].map(id=>state.students[id]).sort((a,b)=>b.score-a.score);
  const praised=sorted.slice(0,3).map(s=>s.name);
  const low=sorted.slice(-2).map(s=>s.name);
  const prog=sorted.filter(s=>s.scoreHist.length>=2&&s.score>s.scoreHist[0]).map(s=>s.name).slice(0,2);
  const hwStats=hwMonthStats(cls);const hwAvg=hwStats.length?Math.round(hwStats.reduce((a,b)=>a+b.rate,0)/hwStats.length):0;
  return {wc,topWeak,praised,low,prog,hwAvg};
}
function ruleSummaryText(cls,instr){
  const d=sumData(cls);
  const topic=extractTopic(instr);
  let req=instr.replace(/今天学的是["“](.+?)["”]，?/,'').replace(/生成.*?总结，?/,'').trim();
  if(!req)req='及时复习巩固，按时完成练习打卡';
  let txt=`【${cls.name} · ${topic}课堂总结】\n各位家长好。今天${cls.name}上了${topic}，整体来看大部分同学掌握较好，学习状态稳定。\n`;
  if(d.praised.length)txt+=`本节课表现突出的有 ${d.praised.join('、')}${d.prog.length?`，其中 ${d.prog.join('、')} 较上次有明显进步`:''}，提出表扬。\n`;
  if(d.topWeak.length)txt+=`全班共性问题集中在 ${d.topWeak.join('、')}，已在课堂重点讲评，还需持续巩固。\n`;
  if(d.low.length)txt+=`${d.low.join('、')} 理解稍慢，需要家长多关注、多陪伴练习。\n`;
  txt+=`本月班级平均作业提交率 ${d.hwAvg}%，请家长继续督促孩子按时打卡。\n课后要求：${req}。\n感谢各位家长配合，家校同心，孩子才能走得更稳。`;
  return txt;
}
function extractTopic(instr){
  let m=instr.match(/今天学的是["“](.+?)["”]/);if(m)return m[1];
  m=instr.match(/生成(.+?)(课堂总结|总结)/);if(m)return m[1];
  m=instr.match(/学的是(.+?)[\s，。]/);if(m)return m[1];
  return '本节课';
}

function ruleDailyChat(note,ask){
  const lines=note.split(/[，,。；;]/).map(s=>s.trim()).filter(Boolean);
  // 主题：取首句，去掉"今天学了…"前缀，再去掉"是…重难点"等修饰，得到纯知识点
  let subj=(lines[0]||note)
    .replace(/(是|属于).*(重难点|重点|期中|期末|考试|核心|关键|基础).*$/,'')
    .replace(/^(今天)?(今天学的是|今天学了|今天学|学习的是|学习了|学了|学的)?/,'')
    .replace(/^的/,'').replace(/了$/,'').replace(/["""]/g,'').trim()||lines[0];
  let body=`【今日学习沟通】\n各位家长好。今天重点学习了「${subj}」。\n`;
  // 保留老师原话中关于"为什么重要"的表述
  const imp=lines.filter(l=>/重难点|重点|期中|期末|考试|核心|关键|基础/.test(l));
  if(imp.length)body+=imp.map(l=>`${l}。`).join('');
  else body+='这是本节课需要真正吃透的内容，熟练度还需课后巩固。\n';
  // 期望/希望类表述
  const wish=lines.filter(l=>/希望|请|鼓励|加油|努力/.test(l)&&!/重难点|重点|期中|期末|考试|核心|关键/.test(l));
  if(wish.length)body+=wish.map(l=>`${l}。`).join('');
  else body+='请家长们鼓励孩子趁热打铁、及时复习，把方法练熟。\n';
  if(ask)body+=`另外，${ask}。`;
  body+='辛苦各位家长配合，咱们一起帮孩子把基础打扎实。';
  return body;
}

function lockMobileZoom(){
  const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
  if(!isTouch)return; // 桌面端不拦截（保留触控板/鼠标缩放行为）
  const isTabletLandscape=()=>window.innerWidth>=1024&&window.matchMedia('(orientation:landscape)').matches;
  const block=(e)=>{ if(!isTabletLandscape()) e.preventDefault(); };
  const noop=(e)=>e.preventDefault();
  ['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,block,{passive:false}));
  document.addEventListener('touchmove',(e)=>{ if(e.touches&&e.touches.length>1&&!isTabletLandscape()) e.preventDefault(); },{passive:false});
  document.addEventListener('dblclick',noop,{passive:false});
}

function setupPWA(){
  // 若同目录没有 manifest（例如单文件分享托管），改用内联 manifest，保证仍可「添加到主屏幕」
  fetch('manifest.webmanifest',{method:'GET'}).then(r=>{if(!r.ok)throw 0;}).catch(()=>{
    const icon=APP_ICON;
    const mf={name:'教师教学工作台',short_name:'教学工作台',start_url:location.href,scope:'./',display:'standalone',background_color:'#ffffff',theme_color:'#e26d97',lang:'zh-CN',icons:[{src:icon,sizes:'160x160',type:'image/png',purpose:'any'}]};
    const el=document.getElementById('pwaManifest');
    if(el)el.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(mf));
  });
  if('serviceWorker' in navigator && location.protocol==='https:'){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('sw.js').then(reg=>{
        // 发现新版本 → 立刻启用并自动刷新一次，避免手机上一直看旧界面
        reg.addEventListener('updatefound',()=>{
          const nw=reg.installing;if(!nw)return;
          nw.addEventListener('statechange',()=>{
            if(nw.state==='installed'&&navigator.serviceWorker.controller){
              if(!sessionStorage.getItem('twb_reloaded')){
                sessionStorage.setItem('twb_reloaded','1');
                toast('已更新到新版本，正在刷新…');
                setTimeout(()=>location.reload(),800);
              }
            }
          });
        });
        reg.update();
      }).catch(()=>{});
    });
  }
}
